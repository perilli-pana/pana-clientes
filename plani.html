<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planificación — Pana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
/* Misma piel que "Octubre Escrito": papel claro, Bricolage para números y títulos,
   Archivo Narrow para etiquetas, un color por cliente. */
:root{
  --bg:#F1F0EC; --surface:#FBFAF8; --surface-2:#E9E7E1; --field:#FFFFFF;
  --ink:#1A1815; --muted:#6D6960; --faint:#949086; --line:#DFDCD4;
  --hito:#8A1C1C; --hito-bg:#F6E7E4;
  --ok:#3F6B45; --pend:#9A6410; --pend-bg:#F6EDDC;
  --shadow:0 1px 2px rgba(26,24,21,.05), 0 8px 24px -16px rgba(26,24,21,.25);
  /* clientes de Cami */
  --ap:#1C7C8C; --aurelia:#6E4FB8; --cantina:#A0621A; --clinica:#2F5FA8; --solgast:#3E7D5A; --vialmaq:#8F7200; --canntek:#6F6F22;
  /* Grupo Co (los mismos de Octubre Escrito) */
  --thunder:#B98708; --parrilla:#B3402A; --bodegon:#8E5C33; --pasta:#5C7234; --marvino:#256381; --chinita:#A63E6D;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131210; --surface:#1C1B18; --surface-2:#252320; --field:#111010;
    --ink:#EFEDE7; --muted:#9B968B; --faint:#6E6A61; --line:#302E29;
    --hito:#F0A79A; --hito-bg:#33201D;
    --ok:#8DC095; --pend:#E3B166; --pend-bg:#2C2419;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
    --ap:#5CC6D6; --aurelia:#B39CFF; --cantina:#E0A35A; --clinica:#7FA8E8; --solgast:#86C7A0; --vialmaq:#F2C94C; --canntek:#C4C46A;
    --thunder:#E8B838; --parrilla:#E27A62; --bodegon:#C99763; --pasta:#A0BC64; --marvino:#6FB4D4; --chinita:#E27CA9;
  }
}
:root[data-theme="dark"]{
  --bg:#131210; --surface:#1C1B18; --surface-2:#252320; --field:#111010;
  --ink:#EFEDE7; --muted:#9B968B; --faint:#6E6A61; --line:#302E29;
  --hito:#F0A79A; --hito-bg:#33201D;
  --ok:#8DC095; --pend:#E3B166; --pend-bg:#2C2419;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.7);
  --ap:#5CC6D6; --aurelia:#B39CFF; --cantina:#E0A35A; --clinica:#7FA8E8; --solgast:#86C7A0; --vialmaq:#F2C94C; --canntek:#C4C46A;
  --thunder:#E8B838; --parrilla:#E27A62; --bodegon:#C99763; --pasta:#A0BC64; --marvino:#6FB4D4; --chinita:#E27CA9;
}

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Instrument Sans",system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
.wrap{max-width:1440px; margin:0 auto; padding:40px 24px 120px}
.hidden{display:none!important}

/* ---------- cabecera ---------- */
header.top{display:flex; flex-wrap:wrap; gap:32px; align-items:flex-end; justify-content:space-between; margin-bottom:22px}
.eyebrow{font-family:"Archivo Narrow",sans-serif; font-weight:700; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.eyebrow button{font:inherit; letter-spacing:inherit; text-transform:inherit; color:var(--faint); background:none; border:none; border-bottom:1px solid var(--line); cursor:pointer; padding:0}
.eyebrow button[aria-pressed="true"]{color:var(--ink); border-color:var(--ink)}
.titulo{display:flex; align-items:center; gap:12px}
h1{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif; font-weight:800; font-size:clamp(38px,6vw,60px); line-height:.95; letter-spacing:-.02em; margin:0; text-wrap:balance}
h1 span{color:var(--muted); font-weight:600}
.flecha{font:inherit; font-size:20px; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; flex:none}
.flecha:hover{color:var(--ink); border-color:var(--muted)}
.sub{color:var(--muted); margin:10px 0 0; max-width:62ch}
.stats{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.stat{padding:12px 20px; border-right:1px solid var(--line); min-width:92px}
.stat:last-child{border-right:none}
.stat b{display:block; font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:26px; line-height:1.1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.stat i{display:block; font-style:normal; font-family:"Archivo Narrow",sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:2px}
.stat.hecho b{color:var(--ok)}

/* meses que vienen: para adelantar trabajo */
.meses{display:flex; gap:8px; overflow-x:auto; margin-bottom:22px; padding-bottom:2px}
.mz{flex:none; font:inherit; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-width:112px; color:var(--ink)}
.mz:hover{border-color:var(--muted)}
.mz[aria-current="true"]{border-color:var(--ink); box-shadow:inset 0 3px 0 var(--ink)}
.mz b{display:block; font-family:"Archivo Narrow",sans-serif; font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase}
.mz i{display:block; font-style:normal; font-size:12px; color:var(--muted)}
.mz.vacio i{color:var(--faint)}

/* ---------- barra de clientes ---------- */
.brandbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:14px 0 18px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:22px}
.brandbar .lbl{font-family:"Archivo Narrow",sans-serif; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-right:6px}
button.chip{display:inline-flex; align-items:center; gap:8px; font:inherit; font-size:13.5px; font-weight:500; padding:6px 12px 6px 9px; border-radius:999px; cursor:pointer; background:var(--surface); color:var(--ink); border:1px solid var(--line); transition:border-color .15s, background .15s, opacity .15s}
button.chip:hover{border-color:var(--muted)}
button.chip .dot{width:9px; height:9px; border-radius:50%; background:var(--c); flex:none}
button.chip .n{font-family:"Archivo Narrow",sans-serif; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px}
button.chip[aria-pressed="true"]{background:var(--surface-2); border-color:var(--c)}
body.filtrando button.chip[aria-pressed="false"]{opacity:.42}
.spacer{flex:1}
.toggle{font:inherit; font-size:13px; color:var(--muted); background:none; border:none; cursor:pointer; padding:6px 4px; border-bottom:1px solid var(--line)}
.toggle:hover{color:var(--ink); border-color:var(--muted)}
button.toggle[aria-pressed="true"]{background:var(--surface-2); border-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

/* ---------- calendario ---------- */
.dow{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; margin-bottom:8px}
.dow div{font-family:"Archivo Narrow",sans-serif; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding-left:2px}
.grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px}
.day{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 9px 11px; min-height:132px; display:flex; flex-direction:column; gap:7px; box-shadow:var(--shadow); min-width:0}
.day.pad{background:none; border:none; box-shadow:none; min-height:0}
.day.finde{background:var(--surface-2)}
.day.hito{border-color:var(--hito)}
.day.hoy{border-color:var(--ink); box-shadow:inset 0 3px 0 var(--ink)}
.dhead{display:flex; align-items:baseline; gap:6px}
.dnum{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:19px; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.dname{font-family:"Archivo Narrow",sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.mom{background:var(--hito-bg); color:var(--hito); border-radius:5px; padding:4px 7px; font-family:"Archivo Narrow",sans-serif; font-weight:700; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; line-height:1.3}
.brow{display:flex; gap:6px; align-items:flex-start; padding-left:6px; border-left:2px solid var(--c)}
.brow.off{display:none}
.bname{font-family:"Archivo Narrow",sans-serif; font-weight:700; font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--c); width:38px; flex:none; padding-top:2px}
.pieces{display:flex; flex-wrap:wrap; gap:3px; flex:1; min-width:0}
button.lb{
  font-family:"Archivo Narrow",sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.04em;
  padding:2px 5px; border-radius:4px; text-align:left; cursor:text;
  color:var(--faint); border:1px dashed var(--line); background:none;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
button.lb:hover{border-color:var(--muted); color:var(--muted)}
button.lb.lleno{color:var(--ink); border-style:solid; border-color:var(--ok); text-transform:none; letter-spacing:0; font-family:"Instrument Sans",sans-serif; font-size:11px; font-weight:500}
button.lb.feed{border-style:solid; border-color:var(--c); border-width:2px; color:var(--c); font-weight:700; background:color-mix(in srgb, var(--c) 14%, var(--surface))}
button.lb .cn{font-family:"Archivo Narrow",sans-serif; font-weight:800; font-size:9.5px; letter-spacing:.04em; color:var(--c); margin-right:4px}
button.lb.confoto::after{content:" 📷"}
button.lb.ennotion::after{content:" ✓"}
button.lb.confoto.ennotion::after{content:" 📷✓"}
button.lb.pega{display:none; border:1px dashed var(--c); color:var(--c); cursor:copy}
body.conporta .day:hover button.lb.pega, body.conporta button.lb.pega:focus-visible{display:inline-block}
button.lb.pega{font-family:"Archivo Narrow",sans-serif; text-transform:uppercase; letter-spacing:.06em}
button.lb.mas{border-color:transparent; color:var(--faint); padding:2px 5px; cursor:pointer}
button.lb.mas:hover{border-color:var(--line); color:var(--ink)}
button.lb.mas.solo{opacity:0}
.day:hover button.lb.mas.solo, button.lb.mas.solo:focus-visible{opacity:1}

/* editor de una pieza, abierto adentro del día */
/* el rectángulo para escribir, en el lugar de la pieza (como Octubre Escrito) */
.edit{flex:none; display:flex; flex-direction:column; gap:4px; width:max(100%,260px); position:relative; z-index:6; padding:6px; border-radius:6px; background:var(--surface); border:1px solid var(--c); box-shadow:0 12px 40px -14px rgba(0,0,0,.35)}
.edit.der{margin-left:min(0px, calc(100% - 260px))}
.edit textarea{font:inherit; font-size:13px; line-height:1.4; width:100%; resize:vertical; padding:5px 7px; border-radius:4px; background:var(--field); color:var(--ink); border:1px solid var(--line); outline:none}
.edit textarea:focus{border-color:var(--c)}
/* modo rápido: sólo el texto, en el lugar, como Octubre Escrito; el + abre las opciones */
.edit.rapido{display:block; position:relative; width:100%; min-width:0; padding:0; border:none; background:none; box-shadow:none; margin-left:0}
.edit.rapido textarea{display:block; width:100%; font-size:11.5px; padding:3px 24px 3px 6px; border-color:var(--c); resize:none}
.edit.rapido button.masop{position:absolute; top:3px; right:3px; width:18px; height:18px; padding:0; border-radius:4px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font:600 13px/1 "Instrument Sans",sans-serif; cursor:pointer}
.edit.rapido .sug{display:flex; flex-direction:column; gap:3px; margin-top:3px}
.edit.rapido .suglbl{font-family:"Archivo Narrow",sans-serif; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.edit.rapido .ej{font:inherit; font-size:11px; line-height:1.35; text-align:left; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:3px 6px; cursor:pointer; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line}
.edit.rapido .ej:hover{color:var(--ink); border-color:var(--muted)}
.edit.rapido .ej i{font-style:normal; font-family:"Archivo Narrow",sans-serif; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--c); margin-right:5px}
.edit.rapido button.masop:hover{color:var(--ink); border-color:var(--c)}
.edit input.nota{font:inherit; font-size:11.5px; width:100%; padding:3px 7px; border-radius:4px; background:transparent; color:var(--ink); border:1px dashed var(--line); outline:none}
.edit input.nota:focus{border-color:var(--c)}
.edit .fila{display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.edit .fila button{font-family:"Archivo Narrow",sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer}
.edit .fila button:hover{color:var(--ink); border-color:var(--muted)}
.edit .fila button[aria-pressed="true"]{border-color:var(--c); color:var(--c); background:color-mix(in srgb, var(--c) 14%, var(--surface))}
.edit .fila .sp{flex:1}
.edit .fila button.rep,.edit .fila button.chau{border-color:transparent; background:none; padding:2px 3px}
.edit .fila button.chau:hover{color:var(--hito)}

/* ---------- lista para revisar ---------- */
.rev{display:flex; flex-direction:column; gap:40px}
.rsec h2{font-family:"Bricolage Grotesque",sans-serif; font-size:19px; font-weight:800; margin:0 0 6px; color:var(--c); display:flex; align-items:baseline; gap:10px; letter-spacing:-.01em}
.rsec h2 span{font-family:"Instrument Sans",sans-serif; font-size:12px; font-weight:400; color:var(--faint); letter-spacing:0}
.rrow{display:grid; grid-template-columns:46px 148px minmax(0,1fr) 190px; gap:14px; align-items:start; padding:11px 0; border-top:1px solid var(--line)}
.rrow.vacio{background:var(--pend-bg)}
.rrow.esfeed{background:color-mix(in srgb, var(--c) 8%, var(--surface))}
.rwhen{text-align:right; padding-top:5px}
.rwhen b{font-family:"Archivo Narrow",sans-serif; font-size:17px; font-weight:700; display:block; line-height:1}
.rwhen i{font-style:normal; font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--faint)}
.rwhat{display:flex; flex-direction:column; gap:4px}
.rwhat input{font-family:"Archivo Narrow",sans-serif; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); background:none; border:none; border-bottom:1px dashed var(--line); padding:6px 0 3px; width:100%}
.rwhat input:focus{outline:none; border-color:var(--c); color:var(--ink)}
.rrow.esfeed .rwhat input{color:var(--c); font-weight:800}
.rwhat .canal{display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.rwhat .canal button{font-family:"Archivo Narrow",sans-serif; font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:1px 7px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--faint); cursor:pointer}
.rwhat .canal button[aria-pressed="true"]{border-color:var(--c); color:var(--c)}
.rwhat .canal .marca{font-size:11px; color:var(--ok)}
.rrow textarea{font:inherit; font-size:14px; line-height:1.45; width:100%; resize:vertical; padding:8px 10px; border-radius:8px; background:var(--field); color:var(--ink); border:1px solid var(--line); min-height:58px}
.rrow textarea:focus{outline:2px solid var(--c); outline-offset:1px; border-color:transparent}
.rrow .rfoto{font:inherit; font-size:13px; width:100%; padding:8px 10px; border-radius:8px; background:transparent; color:var(--ink); border:1px dashed var(--line)}
.rrow .rfoto.lleno{border-style:solid; border-color:var(--ok); background:var(--field)}
.rrow .rfoto:focus{outline:2px solid var(--c); outline-offset:1px}
.radd{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 0; border-top:1px solid var(--line); font-size:13px; color:var(--muted)}
.radd input{font:inherit; font-size:13px; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--field); color:var(--ink)}
.radd button{font:inherit; font-size:13px; padding:4px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer}
.nada{color:var(--faint); padding:12px 0; border-top:1px solid var(--line); font-size:13.5px}

/* filtro de feed */
body.solofeed button.lb:not(.feed):not(.mas){display:none}
body.solofeed .rrow:not(.esfeed){display:none}

/* ---------- barra de guardado ---------- */
.savebar{position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:20; display:flex; align-items:center; gap:14px; padding:10px 12px 10px 18px; background:var(--surface); border:1px solid var(--line); border-radius:999px; box-shadow:0 6px 28px -8px rgba(0,0,0,.3); font-size:13.5px; max-width:calc(100vw - 32px)}
.savebar .porta{display:flex; align-items:center; gap:8px; color:var(--ink); font-weight:500; white-space:nowrap; overflow:hidden}
.savebar .porta button{padding:4px 10px}
.savebar .est{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.savebar .est.ok{color:var(--ok)}
.savebar .est.sucio{color:var(--pend); font-weight:500}
.savebar button{font:inherit; font-size:13.5px; font-weight:600; padding:7px 16px; border-radius:999px; cursor:pointer; border:1px solid transparent; background:var(--ink); color:var(--bg); white-space:nowrap}
.savebar button:disabled{opacity:.35; cursor:default}
.savebar button.ghost{background:none; color:var(--muted); border-color:var(--line); font-weight:500}
.savebar button.ghost:hover:not(:disabled){color:var(--ink); border-color:var(--muted)}

/* ---------- puerta ---------- */
.puerta{position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); z-index:50}
.puerta form{display:grid; gap:10px; justify-items:center}
.puerta b{font-family:"Bricolage Grotesque",sans-serif; font-size:28px}
.puerta-btn{font:inherit; padding:9px 18px; border-radius:999px; border:1px solid var(--line); background:var(--ink); color:var(--bg); cursor:pointer}
.puerta small{color:var(--muted); max-width:260px; text-align:center}
.puerta input{font:inherit; padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--field); color:var(--ink); text-align:center; width:220px}

@media (max-width:900px){
  .wrap{padding:28px 16px 110px}
  .dow{display:none}
  .grid{grid-template-columns:1fr}
  .day{min-height:0}
  .day.pad{display:none}
  .bname{width:44px}
  button.lb{white-space:normal}
  button.lb.mas.solo{opacity:1}
  body.conporta button.lb.pega{display:inline-block}
  .edit,.edit.der{width:100%; margin-left:0}
}
@media (max-width:760px){ .rrow{grid-template-columns:40px 1fr} .rrow textarea,.rrow .rfoto{grid-column:1/-1} .savebar .porta{display:flex; align-items:center; gap:8px; color:var(--ink); font-weight:500; white-space:nowrap; overflow:hidden}
.savebar .porta button{padding:4px 10px}
.savebar .est{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button.lb.fija{border-style:solid; border-color:color-mix(in srgb, var(--c) 45%, var(--line)); background:color-mix(in srgb, var(--c) 8%, transparent)}
details.franco{margin:0 0 16px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:13px}
details.franco summary{cursor:pointer; font-family:"Archivo Narrow",sans-serif; font-weight:700; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
details.franco .fr{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:8px}
details.franco .fr b{width:100%; font-size:12px}
details.franco .fr span{color:var(--muted)}
</style>
</head>
<body>

<div class="puerta hidden" id="puerta">
  <form id="puertaForm" onsubmit="return false"><b>Pana</b>
    <button type="button" class="puerta-btn" data-entrar hidden>Entrar con Google</button>
    <small data-aviso></small>
  </form>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow"><span id="grupoTxt">Clientes de Cami</span>
        <button id="gCami" aria-pressed="true">Cami</button><button id="gCo" aria-pressed="false">Grupo Co</button>
        <button id="quien" title="Para firmar lo que tocás">¿quién sos?</button></p>
      <div class="titulo">
        <button class="flecha" id="prev" aria-label="Mes anterior">‹</button>
        <h1 id="titulo">—</h1>
        <button class="flecha" id="next" aria-label="Mes siguiente">›</button>
      </div>
      <p class="sub" id="sub"></p>
    </div>

function repetirMeses(p){
  const d0=new Date(p.fecha+"T12:00"), dw=d0.getDay(), dia=d0.getDate(), g=nuevoGrupo(), txt=(p.copy||"").trim();
  const y0=d0.getFullYear(), m0=d0.getMonth(), n0=new Date(y0,m0+1,0).getDate();
  let semanal=true;
  for(let d=1; d<=n0; d++) if(new Date(y0,m0,d).getDay()===dw && !postsDelDia(p.cid,ymd(y0,m0,d)).some(x=>(x.copy||"").trim()===txt)) semanal=false;
  const hoy=new Date(), tope=new Date(hoy.getFullYear(),hoy.getMonth()+7,1);
  let k=0, meses=0;
  for(let f=new Date(y0,m0+1,1); f<tope; f=new Date(f.getFullYear(),f.getMonth()+1,1)){
    const y=f.getFullYear(), m=f.getMonth(), n=new Date(y,m+1,0).getDate(); meses++;
    const dias = semanal ? [...Array(n).keys()].map(i=>i+1).filter(d=>new Date(y,m,d).getDay()===dw) : (dia<=n ? [dia] : []);
    dias.forEach(d=>{ const iso=ymd(y,m,d);
      if(postsDelDia(p.cid,iso).some(x=>(x.copy||"").trim()===txt)) return;
      crear(p.cid,iso,{pieza:p.pieza||"", copy:p.copy||"", foto:p.foto||"", feed:!!p.feed, story:!!p.story},g); k++; });
  }
  est(k ? "Repetida en "+meses+" meses ("+(semanal?"todos los "+DLARGO[dw]:"cada "+dia)+") · Deshacer la saca de todos" : "Ya estaba en los meses que vienen","ok");
}

/* ---------- importar el Excel de Franco (Grupo Co) ----------
   La misma receta que armó Octubre Escrito (grupo-co-lenguaje/octubre/parse_franco.py + cargar_franco.py):
   cada cosa que Franco escribió en un día se vuelve una pieza. Los fijos (happy hour, horarios, promos)

const FRANCO_HOJAS = { thunder:/^THUNDER\b/, chinita:/^CHINITA\b/, "parrilla-co":/^PARRILLA\b/, "pasta-co":/^PASTAS?\b/, "bodegon-co":/^BODE(GON)?\b/ };

const sinTilde = t => String(t).normalize("NFKD").replace(/[̀-ͯ]/g,"");
const nrm = t => sinTilde(t).replace(/\s+/g," ").trim().toLowerCase();
const slugPieza = t => sinTilde(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
// [lo que escribe Franco, nombre de la pieza, nota, m = fijo · l = para escribir]
const VOC_COMUN = [

const VOC_MARCA = {

const VOC_IGNORAR = [/abre mar y vino/, /sujeto a modificaciones/, /tipo de comunicacion/, /ver horarios/, /mirar bien todo el excel/];
let FIJOS = {}, FRANCO = {};

function leerHoja(ws, y, m){
  // que la tabla arranque en A1 aunque Franco empiece en la columna B: así las columnas son las de siempre
  if(ws["!ref"]){ const rg=XLSX.utils.decode_range(ws["!ref"]); rg.s.c=0; rg.s.r=0; ws["!ref"]=XLSX.utils.encode_range(rg); }
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
  const cab = rows.map((r,i)=> r && String(r[1]??"").trim().toLowerCase()==="lunes" ? i : -1).filter(i=>i>=0);
  const uno = new Date(y,m,1), lunes0 = new Date(y,m,1-((uno.getDay()+6)%7));
  const dias = {}, leyenda = [];
  cab.forEach((ci,w)=>{
    const fin = w+1<cab.length ? cab[w+1] : rows.length;
    for(let r=ci+2; r<fin; r++) for(let k=0;k<7;k++){
      const v = rows[r] && rows[r][k+1]; if(v==null || !String(v).trim()) continue;
      const f = new Date(lunes0.getFullYear(), lunes0.getMonth(), lunes0.getDate()+7*w+k);
      if(f.getMonth()!==m) continue;
      (dias[ymd(f.getFullYear(),f.getMonth(),f.getDate())] ||= []).push(String(v).trim());
    }
  });
  rows.forEach(r=> (r||[]).slice(9).forEach(v=>{ if(v!=null && String(v).trim()) leyenda.push(String(v).trim()); }));
  return { dias, leyenda };
}
function aPiezas(marca, items){
  const out = [], vistos = new Set();
  items.forEach(it=>{
    const t = nrm(it); if(VOC_IGNORAR.some(rx=>rx.test(t))) return;
    // renglones de detalle (precios, cortes del flyer): van a la nota de la pieza de arriba
    if(out.length && /^\$?\s*\d[\d.,]*\s*(pesos|\$|por persona|para \d)?\.?$|\+ ?guarnici|^bife de|^(asado|vacio|matambre)\b|pesos para|por persona\.?$/.test(t)){
      const prev = out[out.length-1]; prev[1] = (prev[1] && prev[1]!=="del Excel de Franco" ? prev[1]+" · " : "") + it.trim(); return; }
    const r = (VOC_MARCA[marca]||[]).concat(VOC_COMUN).find(x=>x[0].test(t));
    if(r && r[1]===false) return;                               // se coló de otra marca
    const nombre = r ? (r[1] || (r[1]==="" ? "FEED · "+it.trim().replace(/^feed\s*/i,"") : it.trim())) : it.trim();
    if(vistos.has(nombre)) return; vistos.add(nombre);
    out.push(r ? [nombre, r[2], r[3]] : [nombre, "del Excel de Franco", "l"]);
  });
  return out;
}
// cuántas piezas tuvo cada marca cada día de la semana el mes pasado (la mediana): es el volumen a sostener
function cuotaDe(cid, y, m){
  const prev = ymKey(new Date(y,m-1,1).getFullYear(), new Date(y,m-1,1).getMonth()), cuenta = {};
  [HIST[cid]||{}, PLAN[cid]||{}].forEach(f=>Object.values(f[prev]||{}).forEach(x=>{ if(!x.aprox) cuenta[x.fecha]=(cuenta[x.fecha]||0)+1; }));
  const por = [[],[],[],[],[],[],[]];
  Object.entries(cuenta).forEach(([f,n])=>por[new Date(f+"T12:00").getDay()].push(n));
  return por.map(a=>{ if(!a.length) return 0; a.sort((x,y)=>x-y); return a[Math.floor(a.length/2)]; });
}
function armarDia(marca, items, dw, cuota){
  const cerrado = marca==="pasta-mar-y-vino" && items.some(i=>/abre mar y vino/.test(nrm(i)));
  let p = cerrado ? [["CERRADO LOS LUNES", "lo aclara el Excel", "m"]] : aPiezas(marca, items);
  if(marca==="bodegon-co" && dw>=1 && dw<=5 && !p.some(x=>x[0]==="MENÚ EJECUTIVO")) p.unshift(["MENÚ EJECUTIVO", "lunes a viernes · los platos llegan cada lunes", "m"]);
  const reserva = p.filter(x=>x[0].startsWith("RESERVAS"));
  const esStory = x => x[2]==="l" && !x[0].startsWith("FEED") && !x[0].startsWith("RESERVAS");
  if(marca==="parrilla-co"){
    // Franco (28-sep): en Parrilla menos historias; la reserva va adentro de la creativa del día
    p = p.filter(x=>!reserva.includes(x));
    if(!p.some(esStory)) p.push(["— libre —", "foto / contenido de marca", "l"]);
    if(reserva.length){ const h = p.find(esStory), diez = reserva.some(x=>x[0].endsWith("10 AM"));
      h[0] = (h[0]==="— libre —" ? "creativa" : h[0]) + " + reserva"; h[1] = "lleva el link de reserva" + (diez ? " · publicar a las 10 am" : ""); }
  } else if(!cerrado){
    // la placa de reservas no se recicla: se escribe ("pocas veces se dice solamente reservas")
    reserva.forEach(x=>{ x[1] = "escrita, con el link: nunca “reservas” a secas" + (x[0].endsWith("10 AM") ? " · publicar a las 10 am" : ""); x[2] = "l"; });
    while(!p.some(esStory) || p.length < cuota) p.push(["— libre —", "foto / contenido de marca", "l"]);
  }
  return p.sort((a,b)=>(a[2]==="l")-(b[2]==="l") || (!a[0].startsWith("FEED"))-(!b[0].startsWith("FEED")) || (a[0]==="— libre —")-(b[0]==="— libre —"));
}
async function importarFranco(file){

  const wb = XLSX.read(await file.arrayBuffer(), { type:"array" });
  const y=cur.y, m=cur.m, ym=ymKey(y,m), MES=sinTilde(MESES[m]).toUpperCase();
  const hojas = {}; Object.entries(FRANCO_HOJAS).forEach(([marca,rx])=>{ const h = wb.SheetNames.find(n=>rx.test(sinTilde(n).toUpperCase().trim()) && sinTilde(n).toUpperCase().includes(MES)); if(h) hojas[marca]=h; });
  if(!Object.keys(hojas).length){ est("El Excel no tiene solapas de "+MESES[m]+": ¿es el de este mes?","sucio"); return; }
  const leido = {}; Object.entries(hojas).forEach(([marca,h])=>leido[marca]=leerHoja(wb.Sheets[h], y, m));
  const cl = Object.fromEntries(clientesDelGrupo().map(c=>[c.name, c]));
  // lo que ya vino del Excel y nadie tocó se rehace; lo que se tocó se deja y no se duplica
  const g = nuevoGrupo(); let saco=0;
  Object.values(SLUG_NOMBRE).forEach(n=>{ const c=cl[n]; if(!c) return;
    postsDe(c.id, ym).forEach(p=>{ if(p.deExcel && (p.updatedAt||0)-(p.createdAt||0)<1000){ quitar(p,g); saco++; } }); });
  let n=0, fijosEscritos=0, sinTexto=0, raros=0;
  const nd = new Date(y,m+1,0).getDate();
  Object.entries(SLUG_NOMBRE).forEach(([marca,nombre])=>{
    const c = cl[nombre]; const fuente = leido[marca==="pasta-mar-y-vino" ? "pasta-co" : marca]; if(!c || !fuente) return;
    const cuota = cuotaDe(c.id, y, m);
    for(let d=1; d<=nd; d++){
      const iso=ymd(y,m,d), dw=new Date(y,m,d).getDay(), ya=new Set(postsDelDia(c.id,iso).map(x=>x.pieza));
      armarDia(marca, fuente.dias[iso]||[], dw, cuota[dw]).forEach(([pieza,nota,tipo])=>{
        if(ya.has(pieza) && pieza!=="— libre —") return;
        const fijo = tipo==="m" ? (FIJOS[c.id]||{})[slugPieza(pieza)] : null;
        if(tipo==="m" && nota!=="producción") fijo ? fijosEscritos++ : sinTexto++;
        if(nota==="del Excel de Franco") raros++;
        const feed = pieza.startsWith("FEED");
        crear(c.id, iso, { pieza, copy: fijo ? fijo.copy : "", foto: nota||"", feed, story: !feed, fija: tipo==="m", deExcel: true }, g); n++;
      });
    }
  });
  const meta = { archivo:file.name, importado:Date.now(), por:quien||"", leyenda:Object.fromEntries(Object.entries(leido).map(([k,v])=>[k,v.leyenda])),
    comentarios: wb.SheetNames.includes("COMENTARIOS") ? XLSX.utils.sheet_to_json(wb.Sheets.COMENTARIOS,{header:1,defval:null}).map(r=>(r||[]).filter(v=>v!=null).join(" ").trim()).filter(Boolean) : [] };
  FRANCO[ym]=meta; db.ref("panaDashboard/plani_franco/"+ym).set(meta);
  est(n+" piezas del Excel · "+fijosEscritos+" fijos ya escritos"+(sinTexto?" · "+sinTexto+" fijos sin texto":"")+(raros?" · "+raros+" cosas nuevas de Franco":"")+(saco?" · se rehicieron las que no habías tocado":""),"ok");
  render();
}

    sug.forEach(x=>{ const b=el("button","ej"); b.type="button";
      b.append(el("i",null,cuandoTxt(x)), document.createTextNode(x.copy.trim()));
      b.title=x.copy+(x.fuente?"\n— "+x.fuente:"");
      b.addEventListener("mousedown",ev=>ev.preventDefault());
      b.onclick=()=>{ t.value=x.copy.trim(); t.rows=Math.max(2,t.value.split("\n").length);
        if(x.feed && !p.feed) guardar(p,{feed:true},false);
        volcar(); lista.remove(); t.focus(); };
      lista.appendChild(b); });
    e.appendChild(lista);
  }

  let antes=antesIn||crudo(p), tm=null, cerrado=false;
  function volcar(){ clearTimeout(tm); if((p.copy||"")!==t.value) guardar(p,{copy:t.value},false); }
  t.addEventListener("input",()=>{ clearTimeout(tm); est("Escribiendo…","sucio"); tm=setTimeout(volcar,600); t.rows=Math.max(2,t.value.split("\n").length);
    if(lista) lista.style.display=t.value.trim()?"none":""; });
  // el +: el mismo rectángulo se abre con todas las opciones, sin perder lo escrito
  mas.onclick=()=>{
    if(cerrado) return; cerrado=true; volcar(); completo=true;
    const grande=editorEl(p, alaDerecha, antes); e.replaceWith(grande);
    const tt=grande.querySelector("textarea"); tt.focus(); tt.setSelectionRange(tt.value.length,tt.value.length);
  };
  function cerrar(){
    if(cerrado) return; cerrado=true;
    volcar();
    if(abierto===p.id) abierto=null;
    const top=deshacer[deshacer.length-1], recienCreada = top && top.id===p.id && top.antes===null;
    if(nadaEscrito(p)){
      if(recienCreada) deshacer.pop();
      $("#deshacer").disabled=!deshacer.length;
      quitar(p,null,true);
    } else if(!recienCreada && (antes.copy||"")!==(p.copy||"")){
      anotar({cid:p.cid, ym:p.fecha.slice(0,7), id:p.id, antes, g:nuevoGrupo()});
    }
    setTimeout(render,0);
  }
  e.addEventListener("focusout",()=>setTimeout(()=>{ if(!e.contains(document.activeElement)) cerrar(); },150));
  t.addEventListener("keydown",ev=>{
    if(ev.key==="Escape"){ ev.preventDefault(); t.value=antes.copy||""; t.blur(); }
    if(ev.key==="Enter" && (ev.metaKey||ev.ctrlKey)){ ev.preventDefault(); t.blur(); }
  });
  return e;
}

/* ---------- lista (para revisar de corrido) ---------- */
function campo(p,key,tag,ph,cls){
  const t=el(tag,cls); t.value=p[key]||""; t.placeholder=ph; t.setAttribute("aria-label",ph);
  let antes=null, tm=null;
  t.addEventListener("focus",()=>{ antes=crudo(p); });
  t.addEventListener("input",()=>{ clearTimeout(tm); est("Escribiendo…","sucio"); tm=setTimeout(()=>guardar(p,{[key]:t.value},false),600); if(cls==="rfoto") t.classList.toggle("lleno",!!t.value.trim()); });
  t.addEventListener("blur",()=>{ clearTimeout(tm);
    if(antes && (antes[key]||"")!==t.value) anotar({cid:p.cid, ym:p.fecha.slice(0,7), id:p.id, antes, g:nuevoGrupo()});
    if((p[key]||"")!==t.value) guardar(p,{[key]:t.value},false);
    antes=null; });
  return t;
}
function listaEl(){
  const w=el("div","rev"), ym=ymKey(cur.y,cur.m);
  visibles().forEach(cl=>{
    const s=el("section","rsec"); s.style.setProperty("--c",cl.color);
    const ps=postsDe(cl.id,ym).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.orden??0)-(b.orden??0));
    const h=el("h2",null,cl.name); h.appendChild(el("span",null,ps.length+(ps.length===1?" pieza":" piezas"))); s.appendChild(h);
    if(!ps.length) s.appendChild(el("div","nada","Todavía nada este mes."));
    ps.forEach(p=>{
      const d=new Date(p.fecha+"T12:00");
      const r=el("div","rrow"+((p.copy||"").trim()?"":" vacio")+(p.feed?" esfeed":""));
      const wn=el("div","rwhen"); wn.append(el("b",null,String(d.getDate())), el("i",null,DCORTO[d.getDay()]));
      const wh=el("div","rwhat");
      const cn=el("div","canal");
      [["feed","feed"],["story","story"]].forEach(([txt,key])=>{ const b=el("button",null,txt); b.setAttribute("aria-pressed",String(!!p[key])); b.onclick=()=>{ guardar(p,{[key]:!p[key]}); render(); }; cn.appendChild(b); });
      if(conFoto(p)) cn.appendChild(el("span","marca","📷")); if(enNotion(p)) cn.appendChild(el("span","marca","✓ Notion"));
      wh.append(cn, campo(p,"pieza","input","qué es"));
      const fo=campo(p,"foto","input","nota o foto (opcional)","rfoto"); if((p.foto||"").trim()) fo.classList.add("lleno");
      r.append(wn, wh, campo(p,"copy","textarea","copy"), fo);
      s.appendChild(r);
    });
    const add=el("div","radd"), di=el("input"), last=new Date(cur.y,cur.m+1,0).getDate();
    di.type="date"; di.min=ymd(cur.y,cur.m,1); di.max=ymd(cur.y,cur.m,last); di.value=ymd(cur.y,cur.m,1);
    const bt=el("button",null,"+ agregar"); bt.onclick=()=>{ if(di.value){ crear(cl.id,di.value,{copy:" "}); render(); } };
    add.append(document.createTextNode("Otra pieza de "+cl.name+" el"), di, bt);
    s.appendChild(add);
    w.appendChild(s);
  });
  return w;
}

/* ---------- copiar el mes (texto, para pasar o revisar) ---------- */
$("#copiar").onclick=async()=>{
  const ym=ymKey(cur.y,cur.m), out=[MESES[cur.m].toUpperCase()+" "+cur.y,""];
  visibles().forEach(cl=>{
    const ps=postsDe(cl.id,ym).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:(a.orden??0)-(b.orden??0));
    if(!ps.length) return;
    out.push("== "+cl.name.toUpperCase()+" ==");
    ps.forEach(p=>{ const d=new Date(p.fecha+"T12:00");
      out.push(DCORTO[d.getDay()]+" "+d.getDate()+" · "+canalTxt(p)+(p.pieza?" · "+p.pieza:""));
      if(p.copy) out.push(p.copy.trim()); if(p.foto) out.push("nota: "+p.foto); out.push(""); });
  });
  try{ await navigator.clipboard.writeText(out.join("\n")); est("Mes copiado ✓","ok"); }catch(e){ est("No pude copiar","sucio"); }
};

/* ---------- controles ---------- */
$("#prev").onclick=()=>{ const d=new Date(cur.y,cur.m-1,1); irA(d.getFullYear(),d.getMonth()); };
$("#next").onclick=()=>{ const d=new Date(cur.y,cur.m+1,1); irA(d.getFullYear(),d.getMonth()); };
function setGrupo(g){ grupo=g; pref.set("plani.grupo",g); filtro.clear(); document.body.classList.remove("filtrando"); abierto=null; escuchar(); render(); }
$("#gCami").onclick=()=>setGrupo("cami");
$("#gCo").onclick=()=>setGrupo("co");
$("#quien").onclick=()=>{ const op=["Cami","Marcos","Bruno"]; quien=op[(op.indexOf(quien)+1)%op.length]; pref.set("plani.quien",quien); render(); };
$("#portaX").onclick=soltarPorta;
addEventListener("keydown",e=>{
  if(escribiendo()) return;
  if((e.metaKey||e.ctrlKey) && e.key==="z" && !e.shiftKey){ e.preventDefault(); $("#deshacer").click(); }
  if(e.key==="Escape" && porta) soltarPorta();
});

/* ---------- arranque ---------- */
function arrancar(){
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.database();
  db.ref("panaDashboard/clients").on("value",s=>{ CLIENTS=s.val()||{}; escuchar(); render(); });
  db.ref("panaDashboard/events").on("value",s=>{ EVENTS=s.val()||{}; render(); });
  db.ref("panaDashboard/plani_franco").on("value",s=>{ FRANCO=s.val()||{}; render(); });
}
$("#puerta").classList.remove("hidden");
panaEntrar(FIREBASE_CONFIG, $("#puerta"), arrancar);
</script>
